name: Frontend CI

on:
  pull_request:
    branches: [develop, main, frontend_develop, server_develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    # feat/* 에서도 돌려야 머지 전에 결과를 알 수 있다 (docs/ops/CICD.md §1.1)
    branches: [develop, main, frontend_develop, server_develop, 'feat/**']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# 같은 브랜치·PR에 새 커밋이 오면 앞의 실행을 취소한다. Private 저장소는 Actions
# 분(무료 2,000분/월)이 소모되므로 이미 무의미해진 실행에 분을 쓰지 않는다
# (docs/ops/COST_GUARDRAILS.md §3.1).
#
# ⚠️ develop은 취소하지 않는다 — deploy 잡이 Render 훅을 호출하는 중에 끊기면
#    배포가 트리거됐는지 안 됐는지 알 수 없는 상태가 된다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22        # Next 16은 Node 20.9+ 필요
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build (mock)
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK: '1'

      # 실제 배포는 mock=0으로 빌드된다. mock 빌드만 검증하면 서버 컴포넌트가
      # 백엔드를 호출하려다 정적 생성이 터지는 부류의 버그를 못 잡는다
      # (실제로 /my/notices에서 발생해 배포 빌드가 실패했다).
      # 백엔드 없이도 통과해야 한다 — 빌드 시점에 백엔드에 의존하면 안 된다.
      - name: Build (실제 배포 설정 — 백엔드 없이)
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK: '0'
