name: Secret Scan

# ────────────────────────────────────────────────────────────────
#  2026-08-27에 Jenkins에서 이관됐다 (docs/DECISIONS.md).
#
#  ⚠️ 왜 옮겼나 — Jenkins는 PM 로컬 PC에 있다. PC가 꺼져 있으면 시크릿 검사가
#     한 번도 돌지 않는데, 그 사실이 아무 신호 없이 지나간다. 실제로 2026-08-27에
#     하루 종일 Jenkins가 돌지 않아 **시크릿 감지가 통째로 비어 있었다.**
#     배포 트리거를 Actions로 옮긴 것과 같은 이유다:
#     **사람의 PC 상태에 달린 방어는 방어가 아니다.**
#
#  ⚠️ 이 검사는 push를 막지 못한다. 걸리면 **이미 push된 상태**다.
#     해당 키는 즉시 재발급해야 한다 (docs/CICD.md §1.3).
#
#  ⚠️ paths 필터를 두지 않는다 — 시크릿은 어느 파일에든 들어갈 수 있다.
#     그래서 이 워크플로만 모든 변경에서 돈다 (docs/COST_GUARDRAILS.md §3.1).
# ────────────────────────────────────────────────────────────────

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main, frontend_develop, backend_develop, server_develop]

# 같은 브랜치·PR에 새 커밋이 오면 앞의 실행을 취소한다 (무료 분 절약).
# develop은 취소하지 않는다 — 다른 워크플로와 같은 이유로 통일한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # 히스토리는 필요 없다 — git ls-files·git grep은 체크아웃된 트리를 본다
        with:
          fetch-depth: 1

      - name: 시크릿 검사
        run: |
          set -u
          fail=0

          # ── 1. 커밋되면 안 되는 파일 ─────────────────────────
          #    .env.example 등 템플릿은 의도적으로 커밋되므로 예외로 둔다.
          banned=$(git ls-files | grep -E \
            '(^|/)\.env($|\.)|application-local\.yml|application-secret\.yml|application-prod\.yml|\.pem$|\.p12$|id_rsa' \
            | grep -vE '\.env\.(example|sample|template)$' \
            || true)
          if [ -n "$banned" ]; then
            echo "::error::커밋되면 안 되는 파일이 있습니다"
            printf '%s\n' "$banned" | sed 's/^/    /'
            fail=1
          fi

          # ── 2. 시크릿 값 패턴 ────────────────────────────────
          #    allowlist-secret 주석이 있는 줄은 예외 (테스트용 더미 등).
          #
          #    ⚠️ *.md를 제외한다 — 문서에는 플레이스홀더 연결 문자열
          #       (postgresql://<user>:<pw>@host)이 정상적으로 들어간다.
          #       제외하지 않으면 infra/*/README.md 때문에 상시 실패하고,
          #       늘 실패하는 검사는 곧 무시된다. 파일명 검사(1번)는
          #       *.md도 포함해 전 범위로 돈다.
          hits=$(git grep -nE \
            "(JWT_SECRET[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9+/_-]{16,}|R2_SECRET_ACCESS_KEY[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9+/_-]{16,}|KAKAO_CLIENT_SECRET[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9]{16,}|gh[pousr]_[A-Za-z0-9]{16,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|postgres(ql)?://[^:]+:[^@[:space:]]+@)" \
            -- . ':(exclude)*.md' 2>/dev/null | grep -v 'allowlist-secret' | head -20 || true)
          if [ -n "$hits" ]; then
            echo "::error::시크릿으로 보이는 값이 있습니다 — 해당 키를 즉시 재발급하고 환경변수로 옮기세요"
            printf '%s\n' "$hits" | cut -c1-140 | sed 's/^/    /'
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "✓ 시크릿 검사 통과"
