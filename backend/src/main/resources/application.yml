# ─────────────────────────────────────────────────────────────
#  LIGHT API — 공통 설정
#  프로필: local(로컬 개발) · test(CI) · prod(Render)
#  ⚠️ 시크릿은 이 파일에 쓰지 않는다. 전부 환경변수로 주입한다.
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: light-api

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # ★ Neon 무료 티어는 연결 수 제한이 있다. 기본값 10이면 연결이 고갈된다.
      #   (BACKEND_TASKS.md §2.2)
      maximum-pool-size: 3
      connection-timeout: 20000
      # ── 아래 3줄: Neon 자동 정지와 풀의 상호작용 (2026-08-27 인프라) ──────
      #   Neon은 약 5분 유휴 시 컴퓨트를 정지한다. 그게 "월 $0"의 전제다
      #   (docs/ops/COST_GUARDRAILS.md §3.2). 그런데 기본값 그대로는 풀이 그 전제를 깬다.
      #
      # ★ keepalive-time: 0 — **커넥션 유지 핑을 끈다.**
      #   HikariCP 6.3.3의 기본값은 0이 아니라 **2분**이다(`DEFAULT_KEEPALIVE_TIME`).
      #   즉 유휴 커넥션에 2분마다 쿼리를 보낸다 → Neon의 유휴 타이머가 계속
      #   초기화되어 **컴퓨트가 한 번도 정지하지 않는다.** 핑 경로를
      #   /actuator/health/alive로 옮겨 막은 것과 **똑같은 누수를 풀이 다시 만든다.**
      #   ⚠️ 이 사고는 증상이 없다 — 화면·API·테스트 전부 정상으로 보인다.
      keepalive-time: 0
      # ★ minimum-idle: 0 — 유휴 시 풀을 0까지 비운다.
      #   기본값은 maximum-pool-size와 같아서(음수 → maxPoolSize로 보정) 풀이
      #   **고정 크기**로 동작한다. 그러면 커넥션 3개가 영구히 남고, 아래
      #   idle-timeout도 "fixed size pool이라 효과 없음" 경고와 함께 무시된다.
      minimum-idle: 0
      # ★ idle-timeout: 4분 — Neon이 정지(약 5분)하기 **전에** 풀을 비운다.
      #   정지 후에 비우면 죽은 커넥션이 풀에 남아, 실제 사용자 요청의 첫 쿼리가
      #   검증 실패 → 폐기 → 재연결을 거치며 느려진다. 미리 비워 그 경로를 없앤다.
      idle-timeout: 240000

  jpa:
    # 스키마의 주인은 Flyway다. Hibernate가 손대지 않는다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    # 시각은 ISO-8601 UTC + Z (SPEC_API.md §1.3). 타임스탬프 숫자로 내보내지 않는다.
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

  lifecycle:
    # graceful shutdown이 진행 중인 요청을 기다리는 최대 시간. 기본값은 30초인데,
    # Render는 SIGTERM 후 약 30초 뒤 SIGKILL한다 — 기본값이면 **정확히 강제 종료
    # 시한과 같아서** 기다리다 그대로 죽을 수 있다. 20초로 여유를 남긴다.
    timeout-per-shutdown-phase: 20s

server:
  # ★ 8080 고정. 바꾸면 FE의 next.config.ts 프록시가 통째로 어긋난다 (TOOLCHAIN.md §6)
  port: 8080

  # ★ 재배포 때 처리 중인 요청을 끊지 않는다. Render 배포가 지금 잦다.
  #   Spring Boot 3.5부터는 이 값이 이미 기본값(GRACEFUL)이다 — 그래도 명시한다.
  #   기본값에 의존하면 버전이 올라가며 조용히 바뀔 수 있고, 이건 눈에 보이지 않는
  #   방식으로 깨진다(요청이 그냥 사라진다). alive 헬스 그룹과 같은 이유다.
  #   ⚠️ Dockerfile의 `exec java`가 없으면(= java가 PID 1이 아니면) 이 설정은
  #      한 번도 실행되지 않는다. 둘은 같이 봐야 한다.
  shutdown: graceful

  compression:
    # ★ 응답 압축. 목록 JSON(공지·사진첩)이 가장 큰 응답이고, 교회 사이트 방문자
    #   대부분은 모바일 회선이다. 기본 mime-types에 application/json이 이미
    #   들어 있고 기준 크기도 2KB라, 켜는 것만으로 목록 응답에 적용된다.
    #   (작은 응답 — /actuator/health/alive 같은 것 — 은 2KB 미만이라 압축하지 않는다.)
    enabled: true

  tomcat:
    threads:
      # ★ 기본 200개는 512MB·0.1 CPU 인스턴스에 과하다. 스레드마다 스택이 붙어
      #   **힙 밖 메모리**를 먹는데, 힙 상한이 이미 400m이라 여유가 없다
      #   (Dockerfile의 -Xmx 주석).
      #   그리고 위 maximum-pool-size가 3이라 **DB를 쓰는 동시 처리량은 이미 3으로
      #   제한돼 있다** — 스레드 200개는 그 앞에서 대기만 늘린다.
      max: 20
      # 기동 시 미리 만드는 스레드도 10개 → 5개. 콜드스타트에서 덜 만든다.
      min-spare: 5

management:
  endpoints:
    web:
      exposure:
        # health만 연다. 아래 alive 그룹(/actuator/health/alive)이 슬립 방지 핑
        # 대상이고, /actuator/health 자체는 사람이 진단할 때 쓴다.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # ★ 슬립 방지 핑 전용 그룹 — DB를 건드리지 않는다.
        #
        #   /actuator/health 에는 Spring이 DataSource 인디케이터를 자동으로 붙인다.
        #   10분 핑이 그쪽을 때리면 Neon 컴퓨트가 영구히 깨어 있게 되어 무료
        #   컴퓨트 한도를 넘긴다 — "월 $0" 전제가 깨진다
        #   (docs/ops/COST_GUARDRAILS.md §3.2).
        #
        #   include를 명시하는 이유: 기본 liveness 그룹 구성(livenessState)에
        #   의존하면 Spring Boot 버전이 올라가며 조용히 바뀔 수 있다.
        #   HealthProbeTest가 이 구성을 고정한다.
        alive:
          include: ping

springdoc:
  # FE와의 계약서 (ARCHITECTURE.md §6.1). 운영에서는 아래 prod 문서에서 끈다.
  api-docs:
    path: /v3/api-docs
  # ⚠️ 끄지 않으면 "경로에서 참조되지 않은 스키마"가 통째로 지워진다. 우리는
  #    컨트롤러가 생기기 전에도 에러 봉투 형태를 FE에게 보여줘야 하므로 끈다
  #    (OpenApiConfig 참고).
  remove-broken-reference-definitions: false
  swagger-ui:
    path: /swagger-ui.html
    # 태그·엔드포인트를 알파벳순으로 고정한다. 컨트롤러를 추가할 때마다 순서가
    # 뒤바뀌면 FE가 "뭐가 달라졌지"를 매번 다시 훑어야 한다.
    tags-sorter: alpha
    operations-sorter: alpha
    # 열었을 때 전부 펼쳐져 있으면 스크롤이 길다. 목록만 보이게.
    doc-expansion: none
    display-request-duration: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:1800}      # 30분
    refresh-ttl: ${JWT_REFRESH_TTL:1209600} # 14일
  auth:
    # ⚠️ 기본값 false. 로컬은 http라 Secure 쿠키가 브라우저에 저장조차 되지 않아
    #    켜두면 개발 중 로그인이 통째로 안 된다. 운영(https)에서는 아래 prod
    #    문서가 true로 덮는다 — 끄고 배포하면 토큰이 평문 http로 샐 수 있다.
    secure-cookie: false
    # 카카오 콜백이 돌려보낼 FE 주소 (SPEC_API.md §2.8).
    #   ⚠️ 요청에서 받지 않고 설정에서만 읽는다 — 사용자가 정하게 두면
    #      열린 리다이렉트가 되어, 우리 도메인을 거쳐 아무 데나 보내는
    #      링크를 만들 수 있다.
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    # 비밀번호 재설정 토큰 수명(초). 기본 30분 — 1회용이고 만료된다 (NFR-SEC-08).
    #   길면 메일함을 손에 넣은 사람에게 시간을 준다. 짧으면 사용자가 메일을
    #   늦게 확인했을 때 다시 요청해야 한다. 30분은 그 사이 값이다.
    password-reset-ttl: ${PASSWORD_RESET_TTL:1800}
    # ⚠️ 개발용. 켜면 재설정 토큰 평문이 로그에 찍힌다 — 남의 비밀번호를 바꿀 수
    #    있는 값이다. prod 프로필에서는 켜져 있어도 무시한다.
    expose-reset-token: false
  youtube:
    # 설교 영상 목록·라이브 판정 (SPEC_API.md §9.2 · §9.3).
    # ⚠️ API 키를 클라이언트에 실을 수 없어 BE가 프록시한다 (NFR-SEC-22).
    #    키는 application-local.yml(gitignore) 또는 운영 환경변수로 준다.
    # ⚠️ 하루 쿼터 10,000 units. 캐시가 없으면 소진되고, 소진되면 그날
    #    설교 화면이 통째로 빈다 — 캐시는 성능이 아니라 기능 보호 장치다
    #    (SermonService 주석에 계산이 있다).
    api-key: ${YOUTUBE_API_KEY:}
    # 청년교회 채널 (https://www.youtube.com/@light4402). 공개 정보다.
    channel-id: ${YOUTUBE_CHANNEL_ID:UCiG_caE3_ZPu2y04ei_mC7Q}
    # 설교만 담은 재생목록이 있으면 그 id. 비면 제목이 날짜로 시작하는 것만
    # 골라낸다 (SermonTitles) — PM 확인 대기 중인 항목이다.
    playlist-id: ${YOUTUBE_PLAYLIST_ID:}
  storage:
    # 저장 용량 가드 (SPEC_API.md §8.5 · COST_GUARDRAILS.md §3.6).
    # ⚠️ 2026-09-03에 R2에 결제 수단을 등록해서, "카드가 없으니 과금이
    #    물리적으로 불가능하다"는 1차 방어가 사라졌다. 한도를 넘기면 중단이
    #    아니라 실제 청구($0.015/GB·월)가 된다 — 이 값들이 그 방어의 전부다.
    # R2 Standard 무료 한도 10GB.
    limit-bytes: ${STORAGE_LIMIT_BYTES:10737418240}
    # ⚠️ 차단이 100%가 아니라 95%인 이유: 한도에 닿은 뒤 막으면 이미 과금이
    #    시작된 뒤이고, 마지막 한 장이 한도를 넘길 수도 있다.
    warn-percent: ${STORAGE_WARN_PERCENT:80}
    block-percent: ${STORAGE_BLOCK_PERCENT:95}
    # estimatedRemainingPhotos 계산의 대체값 — 사진이 한 장도 없어 실측
    # 평균을 낼 수 없을 때만 쓴다. 2560px WebP 기준 대략 1.4MB.
    average-photo-bytes: ${STORAGE_AVERAGE_PHOTO_BYTES:1400000}
  roster:
    import:
      # 교회 명단 CSV 임포트 (local 프로필 전용).
      # ⚠️ 명단 원본 CSV는 저장소에 커밋하지 않는다 — 교인 수백 명의 이름·
      #    생년월일·전화번호다. 경로는 저장소 밖을 가리킨다.
      enabled: false
      path: ${ROSTER_CSV_PATH:}
      # ⚠️ 한국어 Windows 엑셀의 「CSV로 저장」 기본값은 CP949(MS949)다.
      #    어긋나면 디코더가 거부해 임포트가 실패하고 로그가 인코딩을 지목한다 —
      #    깨진 이름이 DB에 들어가지는 않는다. 그래도 리포트의 이름 표본을
      #    눈으로 확인할 것 (모든 바이트를 받아들이는 인코딩을 설정하면
      #    거부가 일어나지 않는다).
      charset: UTF-8
      # ★ 기본은 예행연습이다. 리포트를 보고 확인한 뒤 켠다.
      apply: false
      # ⚠️ CSV에 없는 기존 행을 비활성 처리할지. 명단 일부만 담긴 CSV를
      #    실수로 넣으면 나머지 전원이 출석부에서 사라진다.
      deactivate-missing: false
  seed:
    # 개발용 시드 계정 (local 프로필 전용). 기본은 꺼둔다.
    # ★ password를 여기에 쓰지 않는다 — 커밋되는 파일이다.
    #   application-local.yml(gitignore됨)이나 SEED_PASSWORD로 준다.
    #   (INTEGRATION.md §2 · ARCHITECTURE.md §13 배포 전 체크리스트)
    enabled: false
    password: ${SEED_PASSWORD:}

---
# ─────────────────────────────────────────────────────────────
#  prod (Render) — 값은 전부 Render 환경변수에서 온다
#  ⚠️ application-prod.yml은 .gitignore에 걸려 있어 배포 이미지에 포함되지 않는다.
#     그래서 운영 설정은 이 문서에 둔다. 시크릿은 없고 플레이스홀더뿐이다.
# ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  auth:
    secure-cookie: true   # ★ https 전용. 끄고 배포하면 토큰이 평문으로 오간다

springdoc:
  swagger-ui:
    enabled: false      # 운영에서는 계약서를 공개하지 않는다
  api-docs:
    enabled: false
