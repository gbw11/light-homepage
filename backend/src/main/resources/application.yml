# ─────────────────────────────────────────────────────────────
#  LIGHT API — 공통 설정
#  프로필: local(로컬 개발) · test(CI) · prod(Render)
#  ⚠️ 시크릿은 이 파일에 쓰지 않는다. 전부 환경변수로 주입한다.
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: light-api

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # ★ Neon 무료 티어는 연결 수 제한이 있다. 기본값 10이면 연결이 고갈된다.
      #   (BACKEND_TASKS.md §2.2)
      maximum-pool-size: 3
      connection-timeout: 20000

  jpa:
    # 스키마의 주인은 Flyway다. Hibernate가 손대지 않는다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    # 시각은 ISO-8601 UTC + Z (SPEC_API.md §1.3). 타임스탬프 숫자로 내보내지 않는다.
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

server:
  # ★ 8080 고정. 바꾸면 FE의 next.config.ts 프록시가 통째로 어긋난다 (TOOLCHAIN.md §6)
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Render 슬립 방지 핑(cron-job.org)이 때리는 엔드포인트
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # FE와의 계약서 (ARCHITECTURE.md §6.1). 운영에서는 아래 prod 문서에서 끈다.
  api-docs:
    path: /v3/api-docs
  # ⚠️ 끄지 않으면 "경로에서 참조되지 않은 스키마"가 통째로 지워진다. 우리는
  #    컨트롤러가 생기기 전에도 에러 봉투 형태를 FE에게 보여줘야 하므로 끈다
  #    (OpenApiConfig 참고).
  remove-broken-reference-definitions: false
  swagger-ui:
    path: /swagger-ui.html
    # 태그·엔드포인트를 알파벳순으로 고정한다. 컨트롤러를 추가할 때마다 순서가
    # 뒤바뀌면 FE가 "뭐가 달라졌지"를 매번 다시 훑어야 한다.
    tags-sorter: alpha
    operations-sorter: alpha
    # 열었을 때 전부 펼쳐져 있으면 스크롤이 길다. 목록만 보이게.
    doc-expansion: none
    display-request-duration: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:1800}      # 30분
    refresh-ttl: ${JWT_REFRESH_TTL:1209600} # 14일

---
# ─────────────────────────────────────────────────────────────
#  prod (Render) — 값은 전부 Render 환경변수에서 온다
#  ⚠️ application-prod.yml은 .gitignore에 걸려 있어 배포 이미지에 포함되지 않는다.
#     그래서 운영 설정은 이 문서에 둔다. 시크릿은 없고 플레이스홀더뿐이다.
# ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

springdoc:
  swagger-ui:
    enabled: false      # 운영에서는 계약서를 공개하지 않는다
  api-docs:
    enabled: false
